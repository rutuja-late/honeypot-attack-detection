<!doctype html><html><head><meta charset="utf-8"><title>Honeypot Live</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:18px}
.cards{display:flex;gap:12px;margin-bottom:14px}
.card{background:#1e293b;padding:14px;border-radius:8px;flex:1}
.card b{font-size:26px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;border-bottom:1px solid #334155;text-align:left}
.box{background:#1e293b;padding:12px;border-radius:8px}
#att tr+tr{cursor:pointer}
button{background:#334155;color:#e2e8f0;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;margin-right:6px}
pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<h2>Honeypot Live Dashboard</h2>
<div class="cards" id="cards"></div>
<div class="box"><canvas id="tl" height="70"></canvas></div>
<div class="grid" style="margin-top:14px">
  <div class="box"><h3>Top attackers</h3><table id="att"></table></div>
  <div class="box"><h3>Countries</h3><table id="cty"></table></div>
  <div class="box"><h3>Top passwords</h3><table id="pw"></table></div>
  <div class="box"><h3>Top usernames</h3><table id="us"></table></div>
</div>
<div class="box" style="margin-top:14px"><h3>Live alerts</h3><table id="alerts"></table></div>
<div class="box" id="detail" style="margin-top:14px;display:none"></div>
<div class="box" style="margin-top:14px"><h3>Recent events</h3><table id="rec"></table></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tbl = (id, head, rows) => {
  document.getElementById(id).innerHTML =
    "<tr>" + head.map(h => "<th>"+esc(h)+"</th>").join("") + "</tr>" +
    rows.map(r => "<tr>" + r.map(v => "<td>"+esc(v)+"</td>").join("") + "</tr>").join("");
};
let chart;
async function load(){
  const d = await (await fetch("/api/stats")).json();
  const t = d.totals;
  document.getElementById("cards").innerHTML =
    [["Events",t.events],["Unique IPs",t.ips],["Blocked",t.blocked],["High/Critical",t.high]]
    .map(x => `<div class="card">${esc(x[0])}<b>${esc(x[1])}</b></div>`).join("");
  tbl("att",["IP","Country","Score","Severity","Blocked"],
      d.attackers.map(a=>[a.ip,a.country,a.score,a.severity,a.blocked?"YES":"no"]));
  tbl("cty",["Country","IPs"], d.countries.map(x=>[x.k,x.n]));
  tbl("pw",["Password","Count"], d.passwords.map(x=>[x.k,x.n]));
  tbl("us",["Username","Count"], d.usernames.map(x=>[x.k,x.n]));
  tbl("rec",["Time","IP","Event","User","Command"],
      d.recent.map(e=>[e.ts,e.src_ip,e.eventid,e.username,e.command]));
  const labels = d.timeline.map(x=>x.k).reverse(), data = d.timeline.map(x=>x.n).reverse();
  if(!chart){
    chart = new Chart(document.getElementById("tl"),
      {type:"line",data:{labels,datasets:[{label:"Events per hour",data,borderColor:"#38bdf8"}]}});
  } else { chart.data.labels = labels; chart.data.datasets[0].data = data; chart.update(); }
}
load(); setInterval(load, 5000);
const HDR = {"X-Requested-With":"honeypot-ui","Content-Type":"application/json"};
async function loadAlerts(){
  const a = await (await fetch("/api/alerts")).json();
  tbl("alerts",["Time","IP","Severity","Rule","Activity"], a.map(x=>[x.ts,x.ip,x.severity,x.rule,x.detail]));
}
async function showAttacker(ip){
  const d = await (await fetch("/api/attacker/"+encodeURIComponent(ip))).json();
  const s = d.summary, box = document.getElementById("detail");
  box.style.display = "block";
  box.innerHTML = `<h3>${esc(d.ip)} | ${esc(d.country)} | risk ${esc(d.score)} (${esc(d.severity)})</h3>
    <p>failed logins ${esc(s.failed_logins)} | successful ${esc(s.successful_logins)} | sessions ${esc(s.sessions)}
       | commands ${esc(s.commands)} | downloads ${esc(s.downloads)}</p>
    <button data-a="block_ip">Simulate block</button>
    <button data-a="increase_monitoring">Simulate more monitoring</button>
    <pre id="resp"></pre>
    <h4>MITRE ATT&amp;CK (with evidence)</h4><table id="mt"></table>
    <h4>Timeline</h4><table id="tt"></table>`;
  box.querySelectorAll("button").forEach(b => b.onclick = async () => {
    const r = await (await fetch("/api/respond", {method:"POST", headers:HDR,
      body:JSON.stringify({ip:d.ip, action:b.dataset.a})})).json();
    document.getElementById("resp").textContent =
      r.error ? "error: "+r.error : "[SIMULATED, firewall untouched] would run: "+r.would_run;
  });
  tbl("mt",["Technique","Name","Hits","Evidence"],
      Object.entries(d.techniques).map(([id,t])=>[id,t.name,t.count,t.evidence.map(e=>e.detail).join(" | ")]));
  tbl("tt",["Time","Session","Event","User","Password","Command / URL"],
      d.timeline.map(e=>[e.ts,e.session,e.eventid,e.username,e.password,e.command||e.url]));
  box.scrollIntoView({behavior:"smooth"});
}
document.getElementById("att").addEventListener("click", ev => {
  const tr = ev.target.closest("tr"), ip = tr && tr.children[0].textContent;
  if (ip && ip !== "IP") showAttacker(ip);
});
loadAlerts(); setInterval(loadAlerts, 3000);

</script></body></html>
